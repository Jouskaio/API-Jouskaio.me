name: Release

# Triggered by a SemVer tag created on main, e.g.:  git tag v0.2.0 && git push --tags
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - with_ocr: "false"
            suffix: ""
          - with_ocr: "true"
            suffix: "-ocr" # e.g. 1.2.0-ocr, latest-ocr
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_OCR=${{ matrix.with_ocr }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ocr-${{ matrix.with_ocr }}
          cache-to: type=gha,mode=max,scope=ocr-${{ matrix.with_ocr }}

  # Deployment on the "portfolio" host, reached through Tailscale (nothing is exposed to the
  # Internet). It runs the image just published; the secrets are the same as WEB-Jouskaio.me.
  deploy:
    name: Deployment
    needs: publish
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      SERVER: ${{ secrets.SERVER_USERNAME }}@192.168.1.101
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: latest

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Update the compose file on the server
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER" \
            "cat > /home/user/Documents/api.jouskaio.me/compose.yml" < deploy/portfolio/compose.yml

      - name: Pull the image and restart the API
        run: sshpass -e ssh -o StrictHostKeyChecking=no "$SERVER" 'bash -s' < deploy/portfolio/deploy.sh
