name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: System tools used by the tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc poppler-utils
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

  # The real handwriting engine (kraken + CPU torch) and its model: heavier, so kept apart.
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra ocr
      - uses: actions/cache@v4
        with:
          path: data/models
          key: ocr-model-${{ hashFiles('scripts/fetch-ocr-model.sh') }}
      - run: scripts/fetch-ocr-model.sh
      - run: uv run mypy
      - run: uv run pytest tests/unit/notes_sync/test_handwriting.py -ra

  docker:
    needs: [quality, ocr]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        with_ocr: ["false", "true"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          build-args: WITH_OCR=${{ matrix.with_ocr }}
          cache-from: type=gha,scope=ocr-${{ matrix.with_ocr }}
          cache-to: type=gha,mode=max,scope=ocr-${{ matrix.with_ocr }}
