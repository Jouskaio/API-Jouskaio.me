# Production stack on the "portfolio" host: the image published by release.yml, with the
# `news` module only (no Notability inbox or Obsidian vault on this machine).
# Copied to /home/user/Documents/api.jouskaio.me/compose.yml by the deploy job.
services:
  api:
    image: ghcr.io/jouskaio/api-jouskaio.me:latest
    env_file: .env
    # Owner of ./data on the host (`id -u` and `id -g`, set in .env).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Same port the old API used. Reached on the LAN by the reverse proxy (Nginx Proxy Manager,
      # another machine: api.jouskaio.me -> http://192.168.1.101:2000) and locally by the deploy
      # health check. Do not forward this port on the router: only the proxy is public.
      - "2000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
